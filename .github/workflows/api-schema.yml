name: API schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-schema.yml
      - api/**

  pull_request:
    branches: [main]
    paths:
      - .github/workflows/api-schema.yml
      - api/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-api-${{ hashFiles('api/**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-api

      - name: Install
        run: make install
        working-directory: api

      # Two different ranges, and the difference is deliberate rather than an oversight:
      #
      #   pull request  the head commit only. This repository squash-merges, so the single
      #                 commit that lands on main has exactly this tree — checking the head
      #                 is checking what will arrive, and the commits in between are a
      #                 review aid that never reaches main.
      #   push          every commit that just landed, because a direct push to main has no
      #                 squash in front of it, and the dispatch job below copies
      #                 api/schema.yml into libretime/client once per commit that touched
      #                 it. A commit with a stale schema would publish a client library for
      #                 an api that never existed.
      #
      # So: keep api/schema.yml regenerated in the tip of your branch, and do not read the
      # push range as a requirement to regenerate per commit on a squash-merged pull
      # request.
      - name: Get pull request commit range
        if: github.event_name == 'pull_request'
        run: echo "COMMIT_RANGE=${{ github.sha }}~1...${{ github.sha }}" >> $GITHUB_ENV

      - name: Get push commit range
        if: github.event_name == 'push'
        run: echo "COMMIT_RANGE=${{ github.event.before }}..${{ github.sha }}" >> $GITHUB_ENV

      - name: Check if schema is outdated
        run: |
          for commit in $(git rev-list --reverse --no-merges ${{ env.COMMIT_RANGE }}); do
              git checkout $commit

              make --quiet schema
              git diff -- schema.yml
              git add schema.yml
              git diff-index --quiet HEAD -- || {
                echo "ERROR: Schema is outdated for commit $commit"
                git show --quiet
                exit 1
              }
          done
        working-directory: api

      # Up to date is not the same as valid. Everything above compares the file against
      # what the code generates today, so a document that no OpenAPI client can consume
      # passes as long as it is wrong consistently. libretime/client is generated from
      # this file, which makes that a broken dependency rather than a documentation nit.
      - name: Validate the document
        run: |
          pip install --quiet openapi-spec-validator==0.9.0
          openapi-spec-validator api/schema.yml

  dispatch:
    if: >
      github.repository_owner == 'libretime'
      && github.event_name == 'push'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: libretime/client
          path: client
          ssh-key: "${{ secrets.API_CLIENT_DEPLOY_KEY }}"

      - name: Dispatch schema update commits
        run: |
          git config --global user.name "libretime-bot"
          git config --global user.email "libretime-bot@users.noreply.github.com"

          for commit in $(git rev-list --reverse --no-merges ${{ github.event.before }}..${{ github.sha }} -- api/schema.yml); do
            cp api/schema.yml client/

            git show \
              --quiet \
              --format="%B%n${{ github.repository }}@%H" \
              "$commit" \
              > commit-message

            pushd client/
            git add schema.yml
            git diff-index --quiet HEAD -- || {
              git commit --file=../commit-message
              git push
            }
            popd

            rm commit-message
          done
