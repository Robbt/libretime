# This file contains a list of package dependencies.
[tzdata]
tzdata = bookworm, noble, trixie, resolute

[=development]
# The api formats its generated OpenAPI document with prettier (see api/Makefile). With no
# node runtime in the image that step is skipped in silence, and CI — which has one — then
# reports thousands of lines of formatting nobody wrote.
nodejs = bookworm, noble, trixie, resolute
npm = bookworm, noble, trixie, resolute
