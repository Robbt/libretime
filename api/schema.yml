    PatchedShowEdit:
      type: object
      description: |-
        The same payload as a create, for the show named in the url.

        There is no separate vocabulary for an edit, and that is deliberate: the
        difference between the two is which show is being described, and the url already
        says. Sending the whole description of a show to change one thing about it is
        how the calendar works, and it is also what makes an edit safe - the rules, the
        nights and the end date are all restated, so nothing stale is left behind.
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          nullable: true
          oneOf:
            - type: string
              format: uri
            - type: string
              maxLength: 0
        genre:
          type: string
          nullable: true
        foreground_color:
          type: string
          default: ffffff
        background_color:
          type: string
          default: "364492"
        timezone:
          type: string
        first_show_on:
          type: string
          format: date
        start_time:
          type: string
          format: time
        duration:
          type: string
        repeats:
          allOf:
            - $ref: "#/components/schemas/RepeatsEnum"
          default: weekly
        week_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description:
            Days of the week, 0 is Sunday. Names are accepted on the way
            in.
          nullable: true
        last_show_on:
          type: string
          format: date
          nullable: true
        record:
          type: boolean
          default: false
        rebroadcasts:
          type: array
          items:
            $ref: "#/components/schemas/RebroadcastField"
        hosts:
          type: array
          items:
            type: integer
          nullable: true
        linked:
          type: boolean
          default: false
        auto_playlist:
          type: integer
          nullable: true
        auto_playlist_repeat:
          type: boolean
          default: false
