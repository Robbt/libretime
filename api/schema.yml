  /api/v2/smart-blocks:
    get:
      operationId: smart_blocks_list
      description: |-
        Set the owner of a created row to the user who created it.

        Applied to the viewsets whose model has an owner, and deliberately quiet in
        two cases:

        - the caller named an owner - a manager moving a playlist to somebody else,
          or an import assigning ownership explicitly. The submitted value wins,
          because it is the more specific instruction.
        - nobody is authenticated. A service writing with the api key is not a user,
          and inventing one would attribute a machine's work to a person. The column
          stays empty, which is what the analyzer's own imports leave it.
      parameters:
        - in: query
          name: id
          schema:
            type: integer
        - in: query
          name: kind
          schema:
            type: string
            nullable: true
            enum:
              - dynamic
              - static
          description: |-
            * `static` - Static
            * `dynamic` - Dynamic
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - in: query
          name: owner
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
      tags:
        - smart-blocks
      security:
        - phpSessionCookie: []
        - cookieAuth: []
        - basicAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartBlock"
          description: ""
    post:
      operationId: smart_blocks_create
