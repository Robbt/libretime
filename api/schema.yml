openapi: 3.0.3
info:
  title: LibreTime API
  version: 2.0.0
  description: Radio Broadcast & Automation Platform
paths:
  /api/v2/files:
    get:
      operationId: files_list
      description: |-
        Set the owner of a created row to the user who created it.

        Applied to the viewsets whose model has an owner, and deliberately quiet in
        two cases:

        - the caller named an owner - a manager moving a playlist to somebody else,
          or an import assigning ownership explicitly. The submitted value wins,
          because it is the more specific instruction.
        - nobody is authenticated. A service writing with the api key is not a user,
          and inventing one would attribute a machine's work to a person. The column
          stays empty, which is what the analyzer's own imports leave it.
      parameters:
        - in: query
          name: album_title
          schema:
            type: string
        - in: query
          name: artist_name
          schema:
            type: string
        - in: query
          name: bpm_max
          schema:
            type: integer
        - in: query
          name: bpm_min
          schema:
            type: integer
        - in: query
          name: composer
          schema:
            type: string
        - in: query
          name: created_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_before
          schema:
            type: string
            format: date-time
        - in: query
          name: exists
          schema:
            type: boolean
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: hidden
          schema:
            type: boolean
        - in: query
          name: id
          schema:
            type: integer
        - in: query
          name: import_status
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
          description: |-
            * `0` - Success
            * `1` - Pending
            * `2` - Failed
        - in: query
          name: last_played_after
          schema:
            type: string
            format: date-time
        - in: query
          name: last_played_before
          schema:
            type: string
            format: date-time
        - in: query
          name: length_max
          schema:
            type: string
        - in: query
          name: length_min
          schema:
            type: string
        - in: query
          name: library
          schema:
            type: integer
        - in: query
          name: md5
          schema:
            type: string
        - in: query
          name: mime
          schema:
            type: string
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - in: query
          name: owner
          schema:
            type: integer
        - in: query
          name: part_of_list
          schema:
            type: boolean
        - in: query
          name: scheduled
          schema:
            type: boolean
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: track_title
          schema:
            type: string
        - in: query
          name: updated_after
          schema:
            type: string
            format: date-time
        - in: query
          name: updated_before
          schema:
            type: string
            format: date-time
      tags:
        - files
      security:
        - phpSessionCookie: []
        - cookieAuth: []
        - basicAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/File"
          description: ""
    post:
      operationId: files_create
      description: |-
        Set the owner of a created row to the user who created it.

        Applied to the viewsets whose model has an owner, and deliberately quiet in
        two cases:

        - the caller named an owner - a manager moving a playlist to somebody else,
          or an import assigning ownership explicitly. The submitted value wins,
          because it is the more specific instruction.
        - nobody is authenticated. A service writing with the api key is not a user,
          and inventing one would attribute a machine's work to a person. The column
          stays empty, which is what the analyzer's own imports leave it.
      tags:
        - files
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/File"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/File"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/File"
        required: true
      security:
        - phpSessionCookie: []
        - cookieAuth: []
        - basicAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
          description: ""
