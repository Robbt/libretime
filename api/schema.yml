    ShowCreate:
      type: object
      description: |-
        A show, as something to be put on the calendar.

        Not a row. A show is the show, the days it comes back on, and the instances
        those produce, and creating one writes all three in one transaction and then
        tells the playout service to reload. The row serializer next to this one
        describes what a show is; this describes what runs when.
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          nullable: true
          oneOf:
            - type: string
              format: uri
            - type: string
              maxLength: 0
        genre:
          type: string
          nullable: true
        foreground_color:
          type: string
          default: ffffff
        background_color:
          type: string
          default: "364492"
        timezone:
          type: string
        first_show_on:
          type: string
          format: date
        start_time:
          type: string
          format: time
        duration:
          type: string
        repeats:
          allOf:
            - $ref: "#/components/schemas/RepeatsEnum"
          default: weekly
        week_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description:
            Days of the week, 0 is Sunday. Names are accepted on the way
            in.
          nullable: true
        last_show_on:
          type: string
          format: date
          nullable: true
        record:
          type: boolean
          default: false
        rebroadcasts:
          type: array
          items:
            $ref: "#/components/schemas/RebroadcastField"
        hosts:
          type: array
          items:
            type: integer
          nullable: true
        linked:
          type: boolean
          default: false
        auto_playlist:
          type: integer
          nullable: true
        auto_playlist_repeat:
          type: boolean
          default: false
        intro_playlist:
          type: integer
          nullable: true
        outro_playlist:
          type: integer
          nullable: true
        live_stream_enabled:
          type: boolean
          default: false
        live_stream_custom:
          type: boolean
          default: false
        live_stream_user:
          type: string
          nullable: true
        live_stream_password:
          type: string
          nullable: true
      required:
        - duration
        - first_show_on
        - name
        - start_time
        - timezone
    ShowDays:
